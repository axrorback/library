<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #f9f9f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="padding: 20px 0;">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="400" style="background-color: #ffffff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">

                    <tr>
                        <td align="center" style="background-color: #1a2a6c; padding: 40px 20px;">
                            <h2 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">Xush kelibsiz!</h2>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 40px 30px; text-align: center;">
                            <p style="color: #555555; font-size: 16px; margin-bottom: 25px;">
                                Salom, <b>{{ username }}</b>!<br>
                                Platformamizda ro'yxatdan o'tganingizdan xursandmiz.
                            </p>

                            <p style="color: #888888; font-size: 14px; margin-bottom: 10px;">Sizning tasdiqlash kodingiz:</p>

                            <div style="background-color: #fdfcf0; border: 2px dashed #d4af37; border-radius: 10px; padding: 20px; margin: 0 auto;">
                                <span style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #1a2a6c; display: block;">
                                    {{ otp_code }}
                                </span>
                            </div>

                            <p style="color: #e74c3c; font-size: 13px; margin-top: 25px; font-style: italic;">
                                ⚠️ Ushbu kod 2 daqiqa davomida amal qiladi.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color: #f4f4f4; padding: 20px; text-align: center; border-top: 1px solid #eeeeee;">
                            <p style="color: #999999; font-size: 12px; margin: 0;">
                                Hurmat bilan, <b style="color: #1a2a6c;">Jamoamiz</b>
                            </p>
                            <p style="color: #999999; font-size: 11px; margin-top: 5px;">
                                Agar bu so'rovni siz yubormagan bo'lsangiz, xabarga e'tibor bermang.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
