{% extends 'base.html' %}

{% block title %}Parolni tiklash{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 50px auto; padding: 30px; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <h2 style="text-align: center; color: #333; margin-bottom: 10px;">Parolni unutdingizmi?</h2>
    <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 25px;">
        Xavotir olmang! Emailingizni kiriting va biz sizga parolni tiklash uchun xavfsiz havola yuboramiz.
    </p>

    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label for="email" style="display: block; margin-bottom: 8px; font-weight: 600; color: #444;">Email manzilingiz</label>
            <input type="email" name="email" id="email" 
                   placeholder="misol@gmail.com" 
                   style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px;" 
                   required>
        </div>

        <button type="submit" 
                style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s;">
            Havolani yuborish
        </button>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <a href="{% url 'login' %}" style="color: #007bff; text-decoration: none; font-size: 14px;">
            ← Loginga qaytish
        </a>
    </div>
</div>

<style>
    /* Tugma ustiga borganda rangini biroz to'qroq qilish */
    button:hover {
        background-color: #0056b3 !important;
    }
</style>
{% endblock %}
