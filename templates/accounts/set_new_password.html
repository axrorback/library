{% extends 'base.html' %}

{% block title %}Yangi parol o'rnatish{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #ddd; border-radius: 10px; font-family: sans-serif;">
    <h2 style="text-align: center;">Yangi parol</h2>
    <p style="color: #666; font-size: 14px; text-align: center;">Iltimos, profilingiz uchun yangi va kuchli parol o'rnating.</p>

    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom: 5px;">Yangi parol:</label>
            <input type="password" name="password" 
                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" 
                   required minlength="8">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom: 5px;">Parolni tasdiqlang:</label>
            <input type="password" name="password_confirm" 
                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" 
                   required minlength="8">
        </div>

        <button type="submit" 
                style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
            Parolni saqlash
        </button>
    </form>
</div>
{% endblock %}
