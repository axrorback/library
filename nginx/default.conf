# ------------------------
# HTTP (80) - ACME + Redirect
# ------------------------
server {
    listen 80;
    server_name library.coderboys.dev;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Hammasini HTTPS ga yo'naltiradi
    location / {
        return 301 https://$$host$$request_uri;
    }
}

# ------------------------
# HTTPS (443)
# ------------------------
server {
    listen 443 ssl http2;
    server_name library.coderboys.dev;

    # SSL
    ssl_certificate /etc/letsencrypt/live/library.coderboys.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.coderboys.dev/privkey.pem;

    # SSL optimizatsiya
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Static fayllar
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Media (agar S3 ishlatmasang kerak)
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # Django (Gunicorn)
    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $$host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;

        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}